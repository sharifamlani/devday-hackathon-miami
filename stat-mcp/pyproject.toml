[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stat-mcp"
version = "0.1.0"
description = "Explainable donor record analysis tools exposed over MCP"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=4,<5",
  "openai-agents>=0.5,<1",
  "openai>=2,<3",
  "pandas>=2.2,<4",
  "openpyxl>=3.1,<4",
  "python-docx>=1.1,<2",
  "pydantic>=2.12,<3",
  "python-dotenv>=1,<2",
  "starlette>=0.37,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/stat_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["src"]
